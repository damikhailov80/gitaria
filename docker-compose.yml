# Локальная база для разработки: npm run db:up
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitaria
      POSTGRES_PASSWORD: gitaria
      POSTGRES_DB: gitaria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
